<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Night Funkin'</title>
	
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<script type="text/javascript" src="./Funkin.js"></script>
	
	<style>
		html, body { 
			margin: 0; 
			padding: 0; 
			height: 100%; 
			width: 100%;
			overflow: hidden; 
			background: #000000;
		}
		#openfl-content { 
			background: #000000; 
			width: 100% !important; 
			height: 100% !important; 
			display: flex;
			justify-content: center;
			align-items: center;
		}
		canvas {
			max-width: 100% !important;
			max-height: 100% !important;
			object-fit: contain !important;
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/pixel.woff') format('woff'),
			url('assets/fonts/pixel.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/vcr.woff') format('woff'),
			url('assets/fonts/vcr.ttf') format('truetype'),
			url('assets/fonts/vcr.svg#VCR%20OSD%20Mono') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.eot?#iefix') format('embedded-opentype'),
			url('flixel/fonts/nokiafc22.woff') format('woff'),
			url('flixel/fonts/nokiafc22.ttf') format('truetype'),
			url('flixel/fonts/nokiafc22.svg#Nokia%20Cellphone%20FC%20Small') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.eot?#iefix') format('embedded-opentype'),
			url('flixel/fonts/monsterrat.woff') format('woff'),
			url('flixel/fonts/monsterrat.ttf') format('truetype'),
			url('flixel/fonts/monsterrat.svg#Monsterrat') format('svg');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	
	<div id="openfl-content"></div>
	
	<script type="text/javascript">
		lime.embed ("Funkin", "openfl-content", 0, 0, { parameters: {} });
	</script>

	<!-- Script de intercepção e corte imediato de áudio na WebView -->
	<script>
		function killAllAudio() {
			// 1. Pausa e silencia qualquer elemento HTML5 de áudio/vídeo
			document.querySelectorAll("audio, video").forEach(el => {
				el.pause();
				el.currentTime = 0;
				el.muted = true;
			});

			// 2. Tenta suspender contextos do Web Audio API ativos
			if (window.AudioContext || window.webkitAudioContext) {
				try {
					if (window.Howler && typeof window.Howler.unload === 'function') {
						window.Howler.unload();
					}
				} catch (e) {}
			}

			// 3. Força o elemento do jogo a pausar se houver API global do OpenFL/Flixel
			try {
				if (window.FlxG && window.FlxG.sound) {
					window.FlxG.sound.muted = true;
				}
			} catch (e) {}
		}

		// Dispara imediatamente assim que o usuário fecha a WebView ou sai da página interna
		document.addEventListener("visibilitychange", () => {
			if (document.hidden) killAllAudio();
		});
		window.addEventListener("blur", killAllAudio);
		window.addEventListener("pagehide", killAllAudio);
		window.addEventListener("beforeunload", killAllAudio);
	</script>
</body>
</html>
