	<title>Friday Night Funkin'</title>

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

	<link rel="shortcut icon" type="image/png" href="./favicon.png">

	<!-- CONTROLE DE SOM (DEVE VIR ANTES DO Funkin.js) -->
	<script>
	(function () {
		var DEBUG = /[?&]debug\b/.test(location.search);
		var contexts = [];
		var medias = [];
		var pausedMedias = [];
		var suspended = false;
		var needsWake = false;
		var leftAt = 0;
		var lastFocusAt = 0;
		var flags = { hidden: false, parentHidden: false, blurred: false, stalled: false };
		var noop = function () {};

		var logBox = null;
		function log(msg) {
			if (!DEBUG) return;
			if (!logBox) {
				logBox = document.createElement('div');
				logBox.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;color:#0f0;' +
					'background:rgba(0,0,0,.7);font:11px monospace;padding:3px 6px;pointer-events:none';
				(document.body || document.documentElement).appendChild(logBox);
			}
			logBox.textContent = msg + ' | som ' + (suspended ? 'PARADO' : 'ligado');
		}

		// 1) Web Audio (Howler/Lime)
		var NativeContext = window.AudioContext || window.webkitAudioContext;
		var nativeSuspend, nativeResume;
		if (NativeContext) {
			nativeSuspend = NativeContext.prototype.suspend;
			nativeResume = NativeContext.prototype.resume;

			var PatchedContext = class extends NativeContext {
				constructor() {
					super(...arguments);
					contexts.push(this);
					if (suspended) nativeSuspend.call(this).catch(noop);
				}
				resume() {
					if (suspended) return Promise.resolve();
					return nativeResume.call(this);
				}
			};
			window.AudioContext = PatchedContext;
			window.webkitAudioContext = PatchedContext;
		}

		// 2) <audio> e new Audio()
		var nativePlay = HTMLMediaElement.prototype.play;
		HTMLMediaElement.prototype.play = function () {
			if (medias.indexOf(this) === -1) medias.push(this);
			if (suspended) return Promise.resolve();
			return nativePlay.apply(this, arguments);
		};

		function playSafely(media) {
			var result = nativePlay.call(media);
			if (result && result.catch) result.catch(noop);
		}

		function suspendAll() {
			if (suspended) return;
			suspended = true;
			contexts.forEach(function (c) {
				if (c.state === 'running') nativeSuspend.call(c).catch(noop);
			});
			pausedMedias = medias.filter(function (m) { return !m.paused; });
			pausedMedias.forEach(function (m) { m.pause(); });
		}

		function resumeAll() {
			if (!suspended) return;
			suspended = false;
			contexts.forEach(function (c) {
				if (c.state === 'suspended') nativeResume.call(c).catch(noop);
			});
			pausedMedias.forEach(playSafely);
			pausedMedias = [];
		}

		function apply() {
			var out = flags.hidden || flags.parentHidden || flags.blurred || flags.stalled;
			if (out) suspendAll(); else resumeAll();
		}

		function leave() {
			if (!needsWake) leftAt = Date.now();
			needsWake = true;
		}

		function returned() {
			if (!needsWake) return;
			setTimeout(function () {
				if (!needsWake) return;
				needsWake = false;
				if (lastFocusAt < leftAt && !document.hidden) {
					window.dispatchEvent(new Event('focus'));
					log('focus enviado');
				}
			}, 400);
		}

		// 3) Eventos de saída e perda de foco
		document.addEventListener('visibilitychange', function () {
			flags.hidden = document.hidden;
			if (flags.hidden) leave(); else returned();
			apply();
			log('visibilitychange ' + (flags.hidden ? 'oculto' : 'visivel'));
		});
		window.addEventListener('pagehide', function () {
			flags.hidden = true; leave(); apply(); log('pagehide');
		});
		window.addEventListener('pageshow', function () {
			flags.hidden = document.hidden;
			if (!flags.hidden) returned();
			apply(); log('pageshow');
		});
		document.addEventListener('freeze', function () {
			flags.hidden = true; leave(); apply(); log('freeze');
		});
		document.addEventListener('resume', function () {
			flags.hidden = document.hidden;
			if (!flags.hidden) returned();
			apply(); log('resume');
		});
		window.addEventListener('blur', function () {
			flags.blurred = true; leave(); apply(); log('blur');
		});
		window.addEventListener('focus', function () {
			lastFocusAt = Date.now();
			flags.blurred = false;
			flags.hidden = document.hidden;
			apply(); log('focus');
		});

		// 4) Recebe comando postMessage do iframe pai (index.html da raiz)
		window.addEventListener('message', function (e) {
			var d = e.data;
			if (e.source !== window.parent || !d || d.type !== 'visibility') return;
			flags.parentHidden = !!d.hidden;
			if (flags.parentHidden) leave(); else returned();
			apply();
			log('pai ' + (flags.parentHidden ? 'oculto' : 'visivel'));
		});

		['pointerdown', 'touchstart', 'keydown'].forEach(function (name) {
			document.addEventListener(name, function () {
				if (flags.blurred && !document.hidden && !flags.parentHidden) {
					flags.blurred = false;
					apply(); returned(); log('toque');
				}
			}, { capture: true, passive: true });
		});

		// Monitor de inatividade de renderização (tela travada/escondida)
		var lastBeat = performance.now();
		(function beat() {
			lastBeat = performance.now();
			requestAnimationFrame(beat);
		})();
		setInterval(function () {
			var nowStalled = performance.now() - lastBeat > 2000;
			if (nowStalled !== flags.stalled) {
				flags.stalled = nowStalled;
				if (!nowStalled) flags.hidden = document.hidden;
				apply();
				log(nowStalled ? 'tela parada' : 'tela voltou');
			}
		}, 500);
	})();
	</script>
