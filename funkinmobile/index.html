<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Friday Night Funkin' Mobile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            position: fixed;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }
    </style>
</head>
<body>

<div id="game">
    <iframe id="game-frame" src="game/index.html?v=2" scrolling="no" frameborder="no" allow="autoplay; fullscreen *;"></iframe>
</div>

<!-- Avisa o jogo (iframe) quando o usuário sai ou volta para a janela do WhatsApp -->
<script>
(function () {
    var frame = document.getElementById('game-frame');

    function notify(hidden) {
        try {
            frame.contentWindow.postMessage({ type: 'visibility', hidden: hidden }, '*');
        } catch (e) {}
    }

    // Sem "blur" de propósito: ao tocar no iframe o foco passa para ele,
    // e a janela de fora receberia blur mesmo com o jogador jogando.
    document.addEventListener('visibilitychange', function () { notify(document.hidden); });
    window.addEventListener('pagehide', function () { notify(true); });
    window.addEventListener('pageshow', function () { notify(document.hidden); });
})();
</script>

</body>
</html>
