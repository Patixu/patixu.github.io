<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Friday Night Funkin' Mobile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            position: fixed;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }
    </style>
</head>
<body>

<div id="game">
    <iframe src="game/index.html" scrolling="no" frameborder="no" allow="autoplay; fullscreen *;"></iframe>
</div>

<!-- Pausa o som se o usuário sair da janela do WhatsApp -->
<script>
  function silenceAllAudio() {
    document.querySelectorAll("audio, video").forEach(media => {
      media.pause();
      media.muted = true;
    });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) silenceAllAudio();
  });
  window.addEventListener("blur", silenceAllAudio);
  window.addEventListener("pagehide", silenceAllAudio);
</script>

</body>
</html>
